<div class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-md">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Create New Order</h2>

  <!-- Success Notification -->
  <div *ngIf="successMessage()" class="mb-4 p-4 text-green-700 bg-green-100 rounded-lg">
    {{ successMessage() }}
  </div>

  <!-- Error Notification -->
  <div *ngIf="errorMessage()" class="mb-4 p-4 text-red-700 bg-red-100 rounded-lg">
    {{ errorMessage() }}
  </div>

  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="space-y-4">
    
    <!-- Customer ID -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Customer ID (GUID)</label>
      <input 
        type="text" 
        formControlName="customerId" 
        class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-gray-900"
      />
    </div>

    <!-- Amount & Currency -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Base Amount</label>
        <input 
          type="number" 
          step="0.01" 
          formControlName="amount" 
          class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-gray-900"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
        <select 
          formControlName="currency" 
          class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-gray-900"
        >
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </div>
    </div>

    <!-- Discount Strategy Selection -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Discount Strategy</label>
        <select 
          formControlName="discountType" 
          class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-gray-900"
        >
          <option value="None">No Discount</option>
          <option value="Percentage">Percentage (%)</option>
          <option value="flat">Fixed Amount</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Discount Value</label>
        <input 
          type="number" 
          formControlName="discountValue" 
          class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-gray-900"
        />
      </div>
    </div>

    <!-- Payment Provider (Factory Pattern Target) -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Payment Gateway</label>
      <div class="flex gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" formControlName="paymentProvider" value="Stripe" />
          <span>Stripe</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" formControlName="paymentProvider" value="PayPal" />
          <span>PayPal</span>
        </label>
      </div>
    </div>

    <!-- Real-time Calculated Total -->
    <div class="p-4 bg-gray-50 rounded-lg flex justify-between items-center border">
      <span class="text-sm font-semibold text-gray-600">Calculated Total Charge:</span>
      <span class="text-xl font-bold text-blue-600">
        {{ calculatedTotal | currency: orderForm.value.currency || 'USD' }}
      </span>
    </div>

    <!-- Submit Button -->
    <button 
      type="submit" 
      [disabled]="isSubmitting() || orderForm.invalid"
      class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold rounded-lg transition"
    >
      {{ isSubmitting() ? 'Processing Order...' : 'Submit Order' }}
    </button>
  </form>
</div>
